// Top-level build file where you can add configuration options common to all sub-projects/modules.
//
// The Android Gradle Plugin and Gradle versions follow the android-project template of
// the SDL revision pinned in thirdparty/SDL, whose Java sources this app compiles.

buildscript {
    repositories {
        mavenCentral()
        google()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.3'
    }
}

allprojects {
    repositories {
        mavenCentral()
        google()
    }
}

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}
