# The port's own APK signing key - committed on purpose, so that every build (CI or a PC) installs over the previous one
# instead of demanding an uninstall. See tools/android/make_keystore.py; it is not a secret and protects nothing.
storeFile=shadow-key.p12
storeType=PKCS12
storePassword=shadowrecomp
keyAlias=shadowrecomp
keyPassword=shadowrecomp
