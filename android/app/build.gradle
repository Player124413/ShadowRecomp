plugins {
    id 'com.android.application'
}

// 64-bit only: "arm64-v8a" (every 64-bit phone) by default, see gradle.properties (shadow.abis).
// The native side comes from ../../CMakeLists.txt; it produces libmain.so, and copies SDL3's Java classes and Aurora's
// surface into app/src/main/java at configure time, so those exist in exactly one place in the repository.
def shadowAbis = (project.findProperty('shadow.abis') ?: 'arm64-v8a').split(',').collect { it.trim() }

// Signing. Two files are tried, in this order:
//   keystore.properties        your own key (not in the repository), if you would rather sign it yourself
//   shadow-signing.properties  the port's own fixed key, committed, together with shadow-key.p12
// The second one exists so that a new APK *updates* the installed app instead of demanding an uninstall: Android refuses
// an update signed by a different key, and Gradle's debug key is generated fresh on every machine, so the CI build used to
// change its key on every run - every update cost the player their settings and saves. See tools/android/make_keystore.py.
def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file('keystore.properties')
if (!keystorePropsFile.exists()) keystorePropsFile = rootProject.file('shadow-signing.properties')
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

android {
    namespace = 'dev.shadowrecomp'
    compileSdk = 35
    ndkVersion = project.findProperty('shadow.ndk') ?: '27.0.12077973'

    defaultConfig {
        applicationId = 'dev.shadowrecomp'
        minSdk = 26                 // Vulkan + ETC2 are required by the renderer and present on every 64-bit phone
        targetSdk = 35
        // versionCode must grow for Android to treat a build as an update of the installed one. CI passes the workflow
        // run number (-Pshadow.versionCode=...), so every artifact is newer than the last; a local build without it
        // still installs over anything older.
        versionCode = (project.findProperty('shadow.versionCode') ?: System.getenv('SHADOW_VERSION_CODE') ?: '1') as int
        versionName = (project.findProperty('shadow.versionName') ?: '1.1').toString()

        ndk {
            abiFilters.addAll(shadowAbis)
        }
        externalNativeBuild {
            cmake {
                // Static libc++: one less .so to ship and to keep in sync with SDL3.
                arguments '-DANDROID_STL=c++_static', '-DANDROID_PLATFORM=android-26', '-DCMAKE_BUILD_TYPE=Release',
                        // Launcher-only build (no disc yet): link stand-ins for the game code. -Pshadow.stubGameCode=ON
                        "-DSHADOW_STUB_GAME_CODE=${project.findProperty('shadow.stubGameCode') ?: 'OFF'}"
                cppFlags '-std=c++20'
            }
        }
    }

    if (!keystoreProps.isEmpty()) {
        signingConfigs {
            port {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storeType keystoreProps['storeType'] ?: 'PKCS12'
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
            jniDebuggable true
            // Same key as the release build and as every earlier CI artifact: an install of this over the previous APK is
            // a plain update. Without a key file (a bare checkout) this falls back to Gradle's debug key.
            if (!keystoreProps.isEmpty()) signingConfig signingConfigs.port
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (!keystoreProps.isEmpty()) signingConfig signingConfigs.port
        }
    }

    externalNativeBuild {
        cmake {
            path file('../../CMakeLists.txt')
            // Which CMake to use. The project needs 3.28 or newer, so a -Pshadow.cmake=<version> from the command line
            // picks an SDK-installed one; without it, Gradle's default applies, and `cmake.dir` in local.properties
            // points it at a CMake that was installed some other way (that is what CI and build.sh do when the SDK has
            // nothing new enough).
            if (project.hasProperty('shadow.cmake')) {
                version project.findProperty('shadow.cmake')
            }
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']   // CMake writes libmain.so and libSDL3.so here
            java.srcDirs = ['src/main/java']         // ours + SDL3's org.libsdl.app + Aurora's dev.encounter.aurora
        }
    }

    packaging {
        jniLibs {
            // Uncompressed and 16 KB page aligned (Android 15 requirement).
            useLegacyPackaging = false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError = false
    }
}

// The libraries are produced by CMake straight into src/main/jniLibs/<abi> (see the CMakeLists' Android branch), so
// Gradle only has to package them.
//
// CMake also *copies SDL3's Java classes and Aurora's surface* into src/main/java when it configures, so Java must not
// start compiling before that has happened: make every Java compile depend on the CMake configure tasks.
tasks.configureEach { task ->
    if (task.name.matches(/compile.*JavaWithJavac/)) {
        dependsOn tasks.matching { it.name.startsWith('configureCMake') || it.name.startsWith('buildCMake') }
    }
}
