# ShadowRecomp, Android. 64-bit only: this is the whole point of the port.
#
# arm64-v8a  - every 64-bit phone (the target). Dawn ships a prebuilt Android aarch64 library, so this needs nothing
#              from you beyond the NDK.
# x86_64     - the emulator, or a 64-bit x86 tablet. Dawn has no prebuilt for it, so the first build compiles Dawn from
#              source (long, and it wants ~10 GB of disk). Add it only if you actually build for one.
shadow.abis=arm64-v8a

org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
android.useAndroidX=false
android.nonTransitiveRClass=true

# The NDK the build uses. Any r26+ works; set your own here if this exact one is not installed.
shadow.ndk=27.0.12077973
