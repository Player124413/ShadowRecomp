name: Android APK

# Builds the 64-bit Android port on GitHub's machines, so nobody has to keep a full NDK toolchain around to find out
# whether the port still compiles.
#
# Three jobs, deliberately separate, because they need different things:
#
#   checks        - the disc-free tests that live in tools/android/ (touch layout, ETC2 encoder, the Java sources).
#                   Needs nothing but g++/python, so it always runs and always means something.
#   compile       - compiles the whole native port (runtime + Aurora + the Android glue) for arm64 with the real NDK,
#                   WITHOUT the game code: tools/android/stub_generated.py stands in for generated/, and every object
#                   file is built while the link is left out. This is the check that catches "it stopped building".
#   apk           - the actual installable APK. The recompiled game code only exists on the machine of someone who owns
#                   the disc, so this job asks for a link to it: "Run workflow" has a box called `game_code_url`, and a
#                   Hugging Face link (or any direct link) to a .tar.gz / .zip of generated/, of a disc folder, or of
#                   main.dol alone is enough - tools/gen.py is run here for the last two. A repository secret
#                   SHADOW_GEN_URL still works as the default for pushes, if you would rather not paste it each time.
#                   Without either, it builds a *launcher-only* APK: the same Gradle/NDK/SDL3/CMake packaging path, with
#                   empty stand-ins in place of the game code (tools/android/stub_generated.py --definitions). That one
#                   installs and shows the launcher but cannot play; it exists so the packaging itself is built and
#                   tested on every push rather than on the one machine that owns a disc.
#
# Nothing here touches the game's data: the disc image, the DOL and generated/ are never committed, and the APK artifact
# contains the recompiled code, not the disc.

on:
  push:
    branches: [main, 'arena/**']
    paths:
      - 'runtime/**'
      - 'android/**'
      - 'third_party/aurora/**'
      - 'tools/android/**'
      - 'CMakeLists.txt'
      - 'VERSION'
      - '.github/workflows/android-apk.yml'
  pull_request:
    paths:
      - 'runtime/**'
      - 'android/**'
      - 'third_party/aurora/**'
      - 'tools/android/**'
      - 'CMakeLists.txt'
  workflow_dispatch:
    inputs:
      game_code_url:
        description: >-
          Link to the game code for the APK: a Hugging Face (or any) direct link to a .tar.gz / .zip of generated/,
          of a disc folder, or of main.dol alone. Leave empty to build the launcher-only APK.
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: 27.0.12077973
  SDK_PLATFORM: 35
  BUILD_TOOLS: 35.0.0
  # Installed from the SDK by the APK job (it brings Ninja along); the CMake that actually does the work is the runner's
  # own, which is newer than this - see the "Let Gradle use this machine's CMake" step. The compile job uses its own.
  SDK_CMAKE: 3.22.1

jobs:
  checks:
    name: Disc-free tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Python tools parse
        run: python3 -m py_compile tools/gen.py tools/dol.py tools/lift.py tools/android/stub_generated.py tools/android/ci_errors.py

      - name: Java sources parse
        run: |
          python3 -m pip install --quiet javalang
          python3 - <<'PY'
          import glob, sys, javalang
          ok = True
          for path in sorted(glob.glob('android/app/src/main/java/**/*.java', recursive=True)):
              if '/org/' in path or '/dev/encounter/' in path:      # SDL3's and Aurora's, copied in by CMake
                  continue
              try:
                  javalang.parse.parse(open(path, encoding='utf-8').read())
                  print('ok  ', path)
              except Exception as e:
                  ok = False
                  print('FAIL', path, e)
          sys.exit(0 if ok else 1)
          PY

      - name: Touch layout round-trip
        run: |
          g++ -std=c++20 -O2 -Wall -Wextra -Iruntime runtime/touch_layout.cpp tools/android/touch_layout_test.cpp \
              -o /tmp/touch_layout_test
          /tmp/touch_layout_test

      - name: ETC2 encoder (decoded by an independent decoder)
        run: |
          python3 -m pip install --quiet texture2ddecoder
          g++ -std=c++20 -O2 -Wall -Wextra -Ithird_party/aurora/lib \
              tools/android/etc2_check.cpp third_party/aurora/lib/gfx/etc2_encode.cpp -o /tmp/etc2_check
          /tmp/etc2_check /tmp/etc2_blocks.bin
          python3 tools/android/etc2_check.py /tmp/etc2_blocks.bin

      - name: Launcher-only stand-ins compile
        # The APK job links these when there is no disc code; a broken generator would only show up there.
        run: |
          python3 tools/android/stub_generated.py --definitions
          g++ -std=c++20 -fsyntax-only -DSHADOW_STUB_GAME_CODE=1 -Igenerated -Iruntime generated/stub_definitions.cpp
          echo "stub_definitions.cpp compiles"

      - name: This workflow parses
        run: |
          python3 -m pip install --quiet pyyaml
          python3 -c "import yaml,sys; yaml.safe_load(open('.github/workflows/android-apk.yml')); print('yaml ok')"

  compile:
    name: Compile the native port (arm64, no game code)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Android SDK, NDK and CMake
        # Done with sdkmanager directly rather than an action, because a download that fails once should be retried
        # instead of costing a whole run (the runner already has the SDK and the command-line tools).
        run: |
          set -uo pipefail
          sdkmanager="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/android-sdk}}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$sdkmanager" ]; then
            echo "::error ::no sdkmanager at $sdkmanager"
            ls -la "${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/nonexistent}}" || true
            exit 1
          fi
          yes 2>/dev/null | "$sdkmanager" --licenses >/dev/null 2>&1 || true
          ok=0
          for attempt in 1 2 3; do
            if "$sdkmanager" --install "ndk;${{ env.NDK_VERSION }}"; then ok=1; break; fi
            echo "sdkmanager failed (attempt $attempt of 3), retrying in 20 s"
            sleep 20
          done
          [ "$ok" = "1" ] || { echo "::error ::the Android SDK packages could not be installed"; exit 1; }
          echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Stand-in generated/ (the disc's code is not in the repository)
        run: python3 tools/android/stub_generated.py

      - name: Configure for arm64
        run: |
          # `set +e` and PIPESTATUS: a configure failure must not be swallowed by tee, and it must be reported as one
          # annotation with the reason (see below) rather than as a bare exit code.
          set +e
          cmake -S . -B build-android -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/$NDK_VERSION/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON 2>&1 | tee configure.log
          cmake_status=${PIPESTATUS[0]}
          echo "cmake exit: $cmake_status"
          # Which of the third-party dependencies were found on the machine and which had to be fetched: put the
          # interesting lines in the annotations, because the configure log itself is not readable everywhere.
          # sqlite3 goes first and as a warning, because it has its own, separate annotation budget and it is the one
          # library whose resolution has actually gone wrong here (a half-found package becomes a bare -lsqlite3).
          grep -E "shadow: sqlite3|aurora: (Using|Fetching) sqlite3" configure.log | head -3 | while IFS= read -r line; do
            printf '::warning title=sqlite3 ::%s\n' "$(printf '%s' "$line" | sed 's/^-- //' | head -c 600)"
          done
          grep -E "aurora: (Using|Fetching)" configure.log | grep -v sqlite | sort -u | head -6 | while IFS= read -r line; do
            printf '::notice ::%s\n' "$(printf '%s' "$line" | sed 's/^-- //' | head -c 300)"
          done
          if [ "$cmake_status" -ne 0 ] || [ ! -f build-android/compile_commands.json ]; then
            python3 tools/android/ci_errors.py configure.log --configure
            echo "::error title=cmake ::no compile_commands.json: the configure step did not get far enough"
            exit 1
          fi
          # Every translation unit the build knows about, as a build target, so we can compile them all and skip the
          # link: linking needs the recompiled game functions, which only the disc can produce.
          python3 - <<'PY' > objects.txt
          import json, os
          build = 'build-android'
          seen = set()
          for entry in json.load(open(os.path.join(build, 'compile_commands.json'))):
              out = entry.get('output')
              if not out:
                  continue
              out = os.path.relpath(out, os.path.abspath(build))   # ninja knows the objects by their in-build path
              if out not in seen:
                  seen.add(out)
                  print(out)
          PY
          wc -l < objects.txt | xargs echo "translation units:"

      - name: Compile everything (the link is deliberately not attempted)
        run: |
          set +e
          xargs -a objects.txt ninja -C build-android -k 0 > build.log 2>&1
          status=$?
          echo "ninja exit: $status"
          # Surface the compiler's complaints where they can be read without downloading a log: the check run's
          # annotations (each one carries the include/instantiation chain and the failing command) and the summary.
          python3 tools/android/ci_errors.py build.log
          python3 tools/android/ci_errors.py build.log --report > ci_errors.txt
          {
            echo "### Native compile (arm64-v8a)"
            echo
            echo '```'
            head -c 120000 ci_errors.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          tail -40 build.log
          exit $status

      # The annotations above are one line each, so they say what broke but not where it was instantiated from. The
      # whole log goes in an artifact: `gh run download <id> -n native-build-log` and read build.log.
      - name: Upload the build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-build-log
          path: |
            build.log
            configure.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Say what was proven
        run: |
          echo "All native sources compiled for arm64-v8a with NDK $NDK_VERSION."
          echo "Not linked and not packaged: that needs generated/ from python tools/gen.py (your own disc)."

  apk:
    name: Build the APK
    runs-on: ubuntu-latest
    needs: [checks, compile]
    steps:
      - uses: actions/checkout@v4

      - id: gamecode
        name: Is the game code available?
        env:
          # What you typed into "Run workflow" wins over the secret, so the secret can stay empty (or stale).
          INPUT_URL: ${{ inputs.game_code_url }}
          SECRET_URL: ${{ secrets.SHADOW_GEN_URL }}
        run: |
          url="${INPUT_URL:-$SECRET_URL}"
          if [ -n "$url" ]; then
            echo "have=yes" >> "$GITHUB_OUTPUT"
            echo "url=$url" >> "$GITHUB_OUTPUT"
            # Do not echo the whole link: a private Hugging Face link can carry a token in it.
            echo "::notice::Building the real APK from the link you gave (generated/, a disc folder, or main.dol)."
          else
            echo "have=no" >> "$GITHUB_OUTPUT"
            echo "::notice::No link and no secret, so there is no game code to link: building a *launcher-only* APK "\
                 "instead (it installs and shows the launcher, but cannot play). For the real one, run this workflow "\
                 "again with game_code_url set to a Hugging Face (or any direct) link to a .tar.gz/.zip of generated/, "\
                 "of your disc folder, or of main.dol alone - see android/README.md."
          fi

      - name: Fetch the game code (or the disc it comes from)
        if: steps.gamecode.outputs.have == 'yes'
        env:
          URL: ${{ steps.gamecode.outputs.url }}
        run: |
          set -euo pipefail
          # -L follows the redirect Hugging Face answers with (huggingface.co -> cdn-lfs.huggingface.co); --retry
          # survives the occasional reset. What lands is either an archive or a single file, and both are accepted:
          #   .tar.gz / .tgz / .zip of generated/, of a disc folder (sys/main.dol + files/), or of main.dol alone;
          #   or main.dol itself, hosted as one file (the usual Hugging Face "upload a file" case).
          curl -fsSL --retry 3 --retry-delay 2 -o /tmp/gamecode.bin "$URL"
          echo "downloaded $(stat -c%s /tmp/gamecode.bin) bytes"
          # A Hugging Face *file page* (huggingface.co/user/repo/blob/main/...) answers with HTML, not with the file.
          # Say that plainly instead of downloading 12 kB of web page and calling it a disc.
          if head -c 512 /tmp/gamecode.bin | grep -qiE '<!doctype html|<html'; then
            echo "::error ::that link is a web page, not a file. On Hugging Face use the direct link: the \"Download\" /"
            echo "::error ::raw button, or .../resolve/main/<file name> in place of .../blob/main/<file name>"
            exit 1
          fi
          rm -rf /tmp/gamecode && mkdir -p /tmp/gamecode
          if tar -tzf /tmp/gamecode.bin >/dev/null 2>&1; then
            echo "archive: tar.gz"
            tar -xzf /tmp/gamecode.bin -C /tmp/gamecode
          elif tar -tJf /tmp/gamecode.bin >/dev/null 2>&1; then
            echo "archive: tar.xz"
            tar -xJf /tmp/gamecode.bin -C /tmp/gamecode
          elif unzip -tq /tmp/gamecode.bin >/dev/null 2>&1; then
            echo "archive: zip"
            unzip -q /tmp/gamecode.bin -d /tmp/gamecode
          else
            echo "not an archive: treating it as main.dol"
            mkdir -p /tmp/gamecode/sys && cp /tmp/gamecode.bin /tmp/gamecode/sys/main.dol
          fi

          gen_cmake=$(find /tmp/gamecode -maxdepth 6 -path '*/generated/files.cmake' | head -1 || true)
          dol=$(find /tmp/gamecode -maxdepth 6 -name main.dol | head -1 || true)
          if [ -n "$gen_cmake" ]; then
            echo "found recompiled game code in $(dirname "$(dirname "$gen_cmake")")"
            mkdir -p generated && cp -a "$(dirname "$gen_cmake")/." generated/
          elif [ -n "$dol" ]; then
            echo "found $dol - recompiling it with tools/gen.py"
            mkdir -p /tmp/disc/sys && cp "$dol" /tmp/disc/sys/main.dol
            python3 -c "import hashlib,sys; h=hashlib.sha1(open('/tmp/disc/sys/main.dol','rb').read()).hexdigest(); \
              print('main.dol sha1:', h); sys.exit(0 if h=='118ef49ebd45b371b6f514e0e1b6d1ba7cf12904' else 1)" \
              || { echo "::error ::that main.dol is not the USA release (GUPE8P rev 0) - the game would not run"; exit 1; }
            SHADOW_DISC=/tmp/disc python3 tools/gen.py
          else
            echo "::error ::the link has neither generated/files.cmake nor a main.dol in it"
            find /tmp/gamecode -maxdepth 3 | head -50
            exit 1
          fi
          test -f generated/files.cmake || { echo "::error ::no generated/files.cmake was produced"; exit 1; }
          echo "game code source files: $(grep -c '\.cpp' generated/files.cmake)"

      - name: Stand-in generated/ (launcher-only APK)
        if: steps.gamecode.outputs.have == 'no'
        run: python3 tools/android/stub_generated.py --definitions

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK, NDK and CMake
        # Done with sdkmanager directly rather than an action, because a download that fails once should be retried
        # instead of costing a whole run (the runner already has the SDK and the command-line tools).
        run: |
          set -uo pipefail
          sdkmanager="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/android-sdk}}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$sdkmanager" ]; then
            echo "::error ::no sdkmanager at $sdkmanager"
            ls -la "${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/nonexistent}}" || true
            exit 1
          fi
          yes 2>/dev/null | "$sdkmanager" --licenses >/dev/null 2>&1 || true
          ok=0
          for attempt in 1 2 3; do
            if "$sdkmanager" --install "platforms;android-${{ env.SDK_PLATFORM }}" "build-tools;${{ env.BUILD_TOOLS }}" "ndk;${{ env.NDK_VERSION }}" "cmake;${{ env.SDK_CMAKE }}"; then ok=1; break; fi
            echo "sdkmanager failed (attempt $attempt of 3), retrying in 20 s"
            sleep 20
          done
          [ "$ok" = "1" ] || { echo "::error ::the Android SDK packages could not be installed"; exit 1; }
          echo "ANDROID_HOME=$ANDROID_HOME"

      - id: cmake
        name: A CMake new enough for the project (3.28+)
        # The SDK's CMake package is 3.22.1, and the project uses FetchContent options and find_package(GLOBAL) that need
        # newer. Try the SDK's newer packages first; if none of them exist, install CMake from PyPI and point Gradle's
        # cmake.dir at it.
        run: |
          set -uo pipefail
          sdkmanager="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/android-sdk}}/cmdline-tools/latest/bin/sdkmanager"
          for package in "cmake;3.31.6" "cmake;3.30.5" "cmake;3.28.3"; do
            if "$sdkmanager" --install "$package" >/dev/null 2>&1; then
              echo "using $package"
              echo "version=${package#cmake;}" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "$package is not available from the SDK"
          done
          echo "falling back to CMake from PyPI, selected with cmake.dir"
          python3 -m pip install --quiet "cmake==3.31.6"
          cmake_dir=$(python3 -c "import cmake, os; print(os.path.dirname(cmake.CMAKE_BIN_DIR))")
          echo "cmake.dir=$cmake_dir" >> android/local.properties
          echo "version=" >> "$GITHUB_OUTPUT"
          "$cmake_dir/bin/cmake" --version | head -1

      - name: Build the APK
        env:
          # Keep Gradle and the Android build files in the workspace, and let the build use a .gradle-dist download.
          GRADLE_OPTS: -Dorg.gradle.daemon=false
          # The launcher-only build links the stand-in game code (see the job's comment at the top of the file).
          SHADOW_GRADLE_ARGS: ${{ steps.cmake.outputs.version && format('-Pshadow.cmake={0}', steps.cmake.outputs.version) || '' }} -Pshadow.stubGameCode=${{ steps.gamecode.outputs.have == 'yes' && 'OFF' || 'ON' }}
        run: |
          set +e
          chmod +x android/build.sh
          (cd android && ./build.sh debug) 2>&1 | tee apk-build.log
          status=${PIPESTATUS[0]}
          echo "build.sh exit: $status"
          # Same reasoning as in the compile job: the annotations are the readable channel, the log is an artifact.
          python3 tools/android/ci_errors.py apk-build.log --keywords
          exit $status

      - name: Upload the build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk-build-log
          path: apk-build.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.gamecode.outputs.have == 'yes' && 'shadowrecomp-android-arm64-debug' || 'shadowrecomp-android-launcher-only' }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
