# Temporary: checks that Actions runs on this branch and reports the runner environment.
name: android-ci-probe
on:
  push:
    branches: ['arena/54f59919-shadowrecomp']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-26.04
    steps:
      - name: Annotation limits
        run: |-
          for size in 1000 4000 16000 64000; do
            body="$(python3 -c "print('size=$size ' + 'x' * ($size - 20) + ' END$size')")"
            echo "::notice title=size-$size::${body}"
          done
          multi="$(printf 'line one\nline two %%25 percent\nline three')"
          multi="${multi//'%'/'%25'}"; multi="${multi//$'\n'/'%0A'}"
          echo "::notice title=multiline::${multi}"
          for i in $(seq 1 14); do echo "::error title=err-$i::error number $i"; done
          for i in $(seq 1 14); do echo "::warning title=warn-$i::warning number $i"; done
      - name: Second step
        run: |-
          for i in $(seq 1 12); do echo "::error title=second-$i::second step error $i"; done
          python3 -c "import venv, sys; print(sys.version)"
          echo "::notice title=misc::$(python3 -m venv /tmp/v && /tmp/v/bin/pip --version | cut -c1-40; id -un; sudo -n true && echo sudo-ok; echo "RUNNER_TEMP=$RUNNER_TEMP"; df -h /tmp | tail -1 | tr -s ' ' | cut -d' ' -f4; git --version)"
